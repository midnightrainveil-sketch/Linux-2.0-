# hypridle: the reading room closes itself when nobody is at the desk.
# The lock screen is the shell's Reading Room (Quickshell WlSessionLock).

general {
    lock_cmd = pidof qs >/dev/null && qs ipc call lock lock
    before_sleep_cmd = loginctl lock-session          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 3                                  # wait until the lock is up
}

# 2.5 min: lower the lamp (dim the screen)
listener {
    timeout = 150
    on-timeout = archive-brightness dim
    on-resume = archive-brightness restore
}

# 2.5 min: keyboard backlight off
listener {
    timeout = 150
    on-timeout = brightnessctl -sd asus::kbd_backlight set 0
    on-resume = brightnessctl -rd asus::kbd_backlight
}

# 5 min: close the reading room
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 20 min on battery: suspend
listener {
    timeout = 1200
    on-timeout = systemctl suspend
    condition_cmd = [ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -n1)" != "1" ]
}
