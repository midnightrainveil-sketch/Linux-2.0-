# The laptop's microphone, cleaned (archive-mic), in two steps:
#   1. WebRTC: noise suppression, a high-pass filter against rumble and fan
#      hum, steady loudness, and echo cancelling for what plays through
#      "Speakers (echo cancelled)"  ->  "Microphone (clean, untoned)"
#   2. a tone filter: the laptop mic's hard, sharp top taken off, a little
#      warmth added  ->  "Microphone (clear)"
# Pick "Microphone (clear)" in calls; archive-mic makes it the default.
# archive-mic tone flat|soft|softer changes step 2; flat (no change) is the
# default, the settings below.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        # if it cannot load, the rest of the sound still starts
        flags = [ nofail ]
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.gain_control = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.voice_detection = true
            }
            capture.props = {
                node.name = "archive_mic_capture"
                node.passive = true
            }
            source.props = {
                node.name = "archive_mic_clean"
                node.description = "Microphone (clean, untoned)"
                priority.session = 1000
            }
            sink.props = {
                node.name = "archive_mic_speakers"
                node.description = "Speakers (echo cancelled)"
            }
            playback.props = {
                node.name = "archive_mic_playback"
                node.passive = true
            }
        }
    }
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Microphone tone"
            media.name = "Microphone tone"
            filter.graph = {
                nodes = [
                    # a little body in the voice
                    { type = builtin name = warmth label = bq_lowshelf
                      control = { "Freq" = 220.0 "Q" = 0.7 "Gain" = 0.0 } }
                    # the laptop mic's harsh presence peak, eased
                    { type = builtin name = presence label = bq_peaking
                      control = { "Freq" = 3200.0 "Q" = 1.0 "Gain" = 0.0 } }
                    # the sharp top: hiss and "s" sounds, turned down
                    { type = builtin name = air label = bq_highshelf
                      control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = top label = bq_lowpass
                      control = { "Freq" = 18000.0 "Q" = 0.7 } }
                ]
                links = [
                    { output = "warmth:Out" input = "presence:In" }
                    { output = "presence:Out" input = "air:In" }
                    { output = "air:Out" input = "top:In" }
                ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "archive_mic_tone"
                node.passive = true
                target.object = "archive_mic_clean"
            }
            playback.props = {
                node.name = "archive_mic"
                node.description = "Microphone (clear)"
                media.class = Audio/Source
                priority.session = 2100
            }
        }
    }
]
