# foot: the working terminal (spec sections 2 and 3).
# IBM Plex Mono for long reading; the muted pigment palette of old botanical
# plate inks. Needs foot 1.26 or newer ([colors-light] / [colors-dark]).
# archive-mode switches running terminals with SIGUSR1 (night) / SIGUSR2 (day)
# and writes the include below so new ones open in the right mode.

[main]
term=foot
font=IBM Plex Mono:size=13
font-bold=IBM Plex Mono:weight=SemiBold:size=13
dpi-aware=no
pad=24x18
include=~/.local/state/archive/foot-theme.ini

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=1000
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-light]
# day: paper.card ground, graphite ink, accent.ink cursor
background=d5d0ca
foreground=1e1d22
cursor=d5d0ca 34405e
selection-background=c4beb6
selection-foreground=1e1d22
urls=34405e
regular0=1e1d22
