# foot: the terminal, as a print on the picture. White type on near-black,
# a little of the picture showing through, the blossom's pink for what
# matters.
[main]
term=foot
font=JetBrains Mono:size=12
font-bold=JetBrains Mono:weight=Bold:size=12
dpi-aware=no
pad=22x16

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=1000
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.88
background=0b0a0b
foreground=f2efed
cursor=0b0a0b f2efed
selection-background=f2efed
selection-foreground=0b0a0b
urls=f4abc0
# black, red, green, yellow, blue, magenta, cyan, white: greys, with the
# blossom where red and magenta would be
regular0=1a191a
regular1=f08a9b
regular2=c9c5c2
regular3=dedad7
regular4=a8a3a1
regular5=f4abc0
regular6=bdb8b6
regular7=f2efed
bright0=6b6766
bright1=f7a9b6
bright2=e3dfdc
bright3=ffffff
bright4=c9c5c2
bright5=f9c6d4
bright6=dedad7
bright7=ffffff
