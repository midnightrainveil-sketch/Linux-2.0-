<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Apps outside the shell: IBM Plex Sans; code: IBM Plex Mono.
     The shell itself asks for Courier Prime and Pinyon Script by name. -->
<fontconfig>
  <alias binding="same"><family>sans-serif</family><prefer><family>IBM Plex Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>IBM Plex Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>IBM Plex Mono</family></prefer></alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
