# The desk terminal's session (ultra-desk): its shell lives in tmux, out of
# sight, so the widget and its fullscreen view (Super + F) are two windows
# onto one shell: what runs, its history and the screen carry over.
# Nothing of tmux shows: no status line, no prefix key.
set -g status off
set -g prefix None
set -g prefix2 None
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks:clipboard"
set -g extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string "#{pane_title}"
# the window follows the view in use: full size while the fullscreen view
# is up, the widget's size again when it closes
set -g window-size latest
setw -g aggressive-resize on
# the wheel scrolls back (into tmux's history); a drag selects and copies
set -g mouse on
# the shell lives on with no window open (the widget closed): opening it
# again picks it up where it was
set -g destroy-unattached off
set -g exit-empty on
# a view attaching (the widget again, or the fullscreen view) is given the
# card's picture: it shows through placeholders, which only name it
set-hook -g client-attached 'run-shell -b "sleep 0.4; ultra-card --send-art #{client_tty}"'
