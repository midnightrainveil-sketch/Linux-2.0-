# The level meters' music (services/Spectrum.qml runs: cava -p this file).
# Six bands, read 30 times a second, written as numbers 0..100 per line.
[general]
bars = 6
framerate = 30
lower_cutoff_freq = 60
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
