# foot: the terminal, as a print on the picture. White type on near-black,
# a little of the picture showing through, the blossom's pink for what
# matters.
[main]
term=foot
font=JetBrains Mono:size=12
font-bold=JetBrains Mono:weight=Bold:size=12
dpi-aware=no
pad=22x16

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=1000
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-dark]
# Cassette OS: the charcoal of the gadgets' screens, cream lettering, rust,
# amber, sage
alpha=0.95
background=24211d
foreground=efe5d3
cursor=24211d f0b04c
selection-background=e9dcc6
selection-foreground=24211d
urls=f0b04c
regular0=2f2b26
regular1=c9583a
regular2=8f9670
regular3=e3a44a
regular4=7d8ba0
regular5=b97a8a
regular6=86a39b
regular7=e6dccb
bright0=6e665b
bright1=e0734f
bright2=aab38a
bright3=f3c068
bright4=98a6bb
bright5=d095a3
bright6=a3c0b7
bright7=fbf4e8
