# foot: the terminal, as a print on the picture. White type on near-black,
# a little of the picture showing through, the blossom's pink for what
# matters.
[main]
initial-color-theme=light
term=foot
font=JetBrains Mono:size=12
font-bold=JetBrains Mono:weight=Bold:size=12
dpi-aware=no
pad=22x16

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=1000
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[colors-light]
# Cassette OS by day: cream paper, charcoal lettering, rust, amber, sage
alpha=0.96
background=f4ebdc
foreground=35312a
cursor=f4ebdc b2512f
selection-background=35312a
selection-foreground=f4ebdc
urls=b2512f
regular0=35312a
regular1=b2512f
regular2=5f6b43
regular3=a5671a
regular4=4a5c78
regular5=8d4a5f
regular6=3f6f68
regular7=d9ccb5
bright0=7a7162
bright1=c9583a
bright2=78855a
bright3=c27f2a
bright4=63769a
bright5=a8657a
bright6=58897f
bright7=fbf4e8
